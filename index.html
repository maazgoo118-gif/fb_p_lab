<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FB Security Lab</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><header>
    <h1>FB Security Lab</h1>
    <p>مختبر التوعية بالأمن السيبراني</p>
</header>

<main class="container">
    <div class="card">
        <h2>محاكاة تسجيل الدخول</h2>
        <p>تجربة تعليمية لاكتشاف صفحات التصيد الإلكتروني.</p>

        <form id="loginForm">
            <input
                type="text"
                id="username"
                placeholder="اسم مستخدم تجريبي"
                required
            >

            <input
                type="password"
                placeholder="لا تدخل كلمة مرور حقيقية"
                disabled
            >

            <button type="submit">بدء الاختبار</button>
        </form>

        <div id="result"></div>
    </div>
</main>

<footer>
    <p>Cybersecurity Awareness Project © 2026</p>
</footer>

<script src="script.js"></script>

</body>
</html>
